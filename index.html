<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد البصري الذكي - مدعوم بـ Groq AI</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #eaeaea;
            --accent-color: #111111;
            --accent-hover: #333333;
            --gray-light: #f8f9fa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        h2 {
            margin-top: 0;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            color: var(--accent-color);
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* إعدادات المفتاح الأمني */
        .settings-box {
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .settings-box input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
        }

        .settings-box button {
            padding: 8px 15px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* طرق الإدخال */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--gray-light);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* الكاميرا */
        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: none;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .capture-btn-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circular-capture {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 4px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .inner-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #fff;
        }

        .upload-section {
            display: block;
            border: 2px dashed #dcdcdc;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            background: var(--gray-light);
        }

        input[type="file"] {
            display: none;
        }

        .preview-box {
            position: relative;
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .preview-box img {
            max-width: 100%;
            max-height: 200px;
            display: block;
            margin: 0 auto;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 12px 8px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #fff;
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            background: var(--gray-light);
            border-color: var(--accent-color);
        }

        .editor-section {
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        textarea.text-output {
            width: 100%;
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            min-height: 90px;
            font-size: 1.05rem;
            line-height: 1.6;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }

        .result-box {
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            min-height: 80px;
            font-size: 1.05rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .status-badge {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 12px;
            font-weight: 500;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>المساعد البصري الذكي</h2>
    <p class="subtitle">تصوير، تحليل، ترجمة، وحل بالذكاء الاصطناعي</p>

    <!-- خانة إدخال المفتاح وحفظه محلياً لعدم إثارة تحذيرات GitHub -->
    <div class="settings-box">
        <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح Groq API هنا...">
        <button onclick="saveApiKey()">حفظ المفتاح</button>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" id="cameraModeBtn" onclick="switchMode('camera')">📷 الكاميرا</button>
        <button class="mode-btn" id="uploadModeBtn" onclick="switchMode('upload')">📁 رفع صورة</button>
    </div>

    <div class="camera-wrapper" id="cameraWrapper">
        <video id="videoFeed" autoplay playsinline></video>
        <div class="capture-btn-container">
            <div class="circular-capture" onclick="captureImage()">
                <div class="inner-circle"></div>
            </div>
        </div>
    </div>

    <label class="upload-section" id="uploadSection" for="imageInput" style="display: none;">
        <span>📁 اختر صورة من جهازك</span>
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <div class="preview-box" id="previewBox">
        <img id="imagePreview" alt="معاينة">
    </div>

    <div class="action-grid">
        <button class="action-btn" onclick="handleOCR()"><span>🔍</span> توضيح الخط</button>
        <button class="action-btn" onclick="handleTranslate()"><span>🌐</span> ترجمة</button>
        <button class="action-btn" onclick="handleSolve()"><span>💡</span> حل الأسئلة</button>
    </div>

    <div class="status-badge" id="statusText">جاهز. أدخل مفتاحك والتقط صورة للبدء.</div>

    <div class="editor-section">
        <div class="section-label">✏️ النص المستخرج:</div>
        <textarea id="editableText" class="text-output" placeholder="النص سيظهر هنا..."></textarea>
    </div>

    <div class="editor-section">
        <div class="section-label">📋 النتائج:</div>
        <div class="result-box" id="resultText">النتائج ستظهر هنا...</div>
    </div>
</div>

<canvas id="canvasElement"></canvas>

<script>
    let videoStream = null;
    let currentImageBase64 = null;

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('groq_api_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }
        switchMode('camera');
    });

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if (key) {
            localStorage.setItem('groq_api_key', key);
            alert("تم حفظ مفتاح API في متصفحك بشكل آمن!");
        } else {
            alert("يرجى إدخال مفتاح صحيح.");
        }
    }

    const cameraWrapper = document.getElementById('cameraWrapper');
    const uploadSection = document.getElementById('uploadSection');
    const videoFeed = document.getElementById('videoFeed');
    const canvasElement = document.getElementById('canvasElement');
    const previewBox = document.getElementById('previewBox');
    const imagePreview = document.getElementById('imagePreview');
    const imageInput = document.getElementById('imageInput');
    
    const statusText = document.getElementById('statusText');
    const editableText = document.getElementById('editableText');
    const resultText = document.getElementById('resultText');

    function switchMode(mode) {
        document.getElementById('cameraModeBtn').classList.toggle('active', mode === 'camera');
        document.getElementById('uploadModeBtn').classList.toggle('active', mode === 'upload');

        if (mode === 'camera') {
            cameraWrapper.style.display = 'block';
            uploadSection.style.display = 'none';
            startCamera();
        } else {
            cameraWrapper.style.display = 'none';
            uploadSection.style.display = 'block';
            stopCamera();
        }
    }

    async function startCamera() {
        try {
            if (videoStream) stopCamera();
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            videoFeed.srcObject = videoStream;
        } catch (err) {
            statusText.textContent = "⚠️ تعذر الوصول للكاميرا، استخدم رفع صورة.";
            switchMode('upload');
        }
    }

    function stopCamera() {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
    }

    function processImageSource(sourceImage) {
        let width = sourceImage.videoWidth || sourceImage.naturalWidth || sourceImage.width || 800;
        let height = sourceImage.videoHeight || sourceImage.naturalHeight || sourceImage.height || 600;
        
        const ctx = canvasElement.getContext('2d');
        canvasElement.width = width;
        canvasElement.height = height;
        ctx.drawImage(sourceImage, 0, 0, width, height);

        currentImageBase64 = canvasElement.toDataURL('image/jpeg', 0.9);
        imagePreview.src = currentImageBase64;
        previewBox.style.display = 'block';
        
        statusText.textContent = "✅ تم التقاط الصورة بوضوح تام! اختر إحدى العمليات بالأسفل:";
        editableText.value = "";
        resultText.textContent = "النتائج ستظهر هنا...";
    }

    function captureImage() {
        if (!videoStream) return;
        processImageSource(videoFeed);
    }

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = () => processImageSource(img);
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    async function callGroqVision(promptText) {
        const apiKey = localStorage.getItem('groq_api_key') || document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) {
            alert("يرجى إدخال وحفظ مفتاح Groq API في الأعلى أولاً!");
            return null;
        }
        if (!currentImageBase64) {
            statusText.textContent = "⚠️ يرجى التقاط صورة أو رفع ملف أولاً!";
            return null;
        }

        statusText.textContent = "⏳ جاري المعالجة بذكاء Groq (90B)...";

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.2-90b-vision-preview", // النموذج المدعوم والقوي للرؤية
                    messages: [
                        {
                            role: "user",
                            content: [
                                { type: "image_url", image_url: { url: currentImageBase64 } },
                                { type: "text", text: promptText }
                            ]
                        }
                    ],
                    temperature: 0.1,
                    max_tokens: 1024
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "خطأ في الاتصال");
            }

            const data = await response.json();
            return data.choices[0].message.content;
        } catch (error) {
            statusText.textContent = "❌ خطأ: " + error.message;
            return null;
        }
    }

    async function handleOCR() {
        const res = await callGroqVision("استخرج جميع النصوص والكلمات من هذه الصورة بدقة حرفية تامة واكتبها كطباعة رقمية نظيفة.");
        if (res) {
            editableText.value = res;
            statusText.textContent = "✅ تم استخراج النص وتوضيحه بنجاح!";
        }
    }

    async function handleTranslate() {
        const res = await callGroqVision("استخرج النص الموجود في هذه الصورة وترجمه إلى اللغة العربية بدقة واحترافية.");
        if (res) {
            resultText.innerHTML = `<strong>الترجمة:</strong><br>${escapeHtml(res)}`;
            statusText.textContent = "✅ تمت الترجمة بنجاح!";
        }
    }

    async function handleSolve() {
        const res = await callGroqVision("اقرأ السؤال أو المسألة الموجودة في هذه الصورة، ثم قم بحلها وشرحها خطوة بخطوة وبشكل مفصل وواضح باللغة العربية.");
        if (res) {
            resultText.innerHTML = `<strong>الحل والشرح المفصل:</strong><br>${escapeHtml(res)}`;
            statusText.textContent = "✅ تم حل السؤال بنجاح!";
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
